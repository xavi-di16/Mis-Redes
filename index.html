<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVR | Enlaces</title>
    <!-- Cargamos Tailwind CSS para los estilos base y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargamos la fuente Inter para un look moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Fondo oscuro con un sutil degradado radial */
            background: radial-gradient(circle at top, #1e293b 0%, #020617 100%);
            min-height: 100vh;
        }

        /* Animación de entrada para que la página aparezca suavemente */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Retrasos escalonados para los botones */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

        .link-wrapper {
            perspective: 1000px;
            width: 100%;
        }

        .link-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
            transform-style: preserve-3d;
            display: block;
        }
        
        .link-card:hover {
            /* Transformación 3D para que la tarjeta "salte" y se incline hacia el usuario */
            transform: rotateX(10deg) rotateY(-5deg) scale(1.03) translateZ(15px);
        }

        /* Colores específicos de marca para los bordes en hover */
        .hover-kick:hover { border-color: #53fc18; box-shadow: 0 15px 30px -10px rgba(83, 252, 24, 0.4); }
        .hover-spotify:hover { border-color: #1DB954; box-shadow: 0 15px 30px -10px rgba(29, 185, 84, 0.4); }
        .hover-youtube:hover { border-color: #FF0000; box-shadow: 0 15px 30px -10px rgba(255, 0, 0, 0.4); }
        .hover-instagram:hover { border-color: #E1306C; box-shadow: 0 15px 30px -10px rgba(225, 48, 108, 0.4); }
        .hover-whatsapp:hover { border-color: #25D366; box-shadow: 0 15px 30px -10px rgba(37, 211, 102, 0.4); }

        /* Elementos internos de la tarjeta para efecto de profundidad (Parallax 3D) */
        .card-content {
            transform: translateZ(25px);
            transition: transform 0.4s ease;
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center p-4 selection:bg-green-500 selection:text-black">

    <main class="w-full max-w-md mx-auto flex flex-col items-center pt-12 pb-20">
        
        <!-- Foto de Perfil (Con un brillo verde simulando estar "En Vivo") -->
        <div class="relative fade-in-up">
            <div class="absolute inset-0 rounded-full bg-green-500 blur-md opacity-30 animate-pulse"></div>
            <!-- Reemplaza el src con la URL de tu avatar real -->
            <img src="https://placehold.co/200x200/1e293b/53fc18?text=XVR" 
                 alt="XVR Profile" 
                 class="relative w-28 h-28 rounded-full border-2 border-green-500 object-cover z-10 shadow-lg">
        </div>

        <!-- Nombre y Bio -->
        <h1 class="mt-6 text-3xl font-bold tracking-tight fade-in-up delay-100">XVR</h1>
        <p class="mt-2 text-slate-400 text-center max-w-xs text-sm font-medium fade-in-up delay-100">
            Creador de contenido & Streamer. <br> Únete a la comunidad 👇
        </p>

        <div class="w-full flex flex-col gap-4 mt-10">
            
            <!-- Botón KICK -->
            <div class="link-wrapper fade-in-up delay-100">
                <a href="https://kick.com/tu-usuario" target="_blank" rel="noopener noreferrer" 
                   class="link-card hover-kick group relative flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 backdrop-blur-md border border-slate-700/50">
                    <div class="card-content flex items-center gap-4 z-10 w-full justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-[#53fc18]/10 flex items-center justify-center group-hover:bg-[#53fc18]/20 transition-colors">
                                <!-- Kick SVG -->
                                <svg class="w-5 h-5 text-[#53fc18]" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h16V4H4zm5 3h2v4h3V7h2v10h-2v-4h-3v4H9V7z"/>
                                </svg>
                            </div>
                            <span class="font-semibold text-slate-100 tracking-wide text-lg">Kick (Streams)</span>
                        </div>
                        <svg class="w-5 h-5 text-slate-500 group-hover:text-white transition-colors transform group-hover:translate-x-1 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            </div>

            <!-- Botón SPOTIFY -->
            <div class="link-wrapper fade-in-up delay-200">
                <a href="https://spotify.com" target="_blank" rel="noopener noreferrer" 
                   class="link-card hover-spotify group relative flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 backdrop-blur-md border border-slate-700/50">
                    <div class="card-content flex items-center gap-4 z-10 w-full justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-[#1DB954]/10 flex items-center justify-center group-hover:bg-[#1DB954]/20 transition-colors">
                                <!-- Spotify SVG -->
                                <svg class="w-5 h-5 text-[#1DB954]" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.24 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15.001 10.62 18.66 12.9c.42.18.6.78.3 1.14zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.781-.18-.6.18-1.2.78-1.38 4.2-1.32 11.28-1.02 15.72 1.621.54.3.72.96.42 1.5-.3.54-.96.72-1.5.42z"/>
                                </svg>
                            </div>
                            <span class="font-semibold text-slate-100 tracking-wide text-lg">Spotify</span>
                        </div>
                        <svg class="w-5 h-5 text-slate-500 group-hover:text-white transition-colors transform group-hover:translate-x-1 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            </div>

            <!-- Botón YOUTUBE -->
            <div class="link-wrapper fade-in-up delay-300">
                <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" 
                   class="link-card hover-youtube group relative flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 backdrop-blur-md border border-slate-700/50">
                    <div class="card-content flex items-center gap-4 z-10 w-full justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-[#FF0000]/10 flex items-center justify-center group-hover:bg-[#FF0000]/20 transition-colors">
                                <!-- YouTube SVG -->
                                <svg class="w-5 h-5 text-[#FF0000]" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                                </svg>
                            </div>
                            <span class="font-semibold text-slate-100 tracking-wide text-lg">YouTube</span>
                        </div>
                        <svg class="w-5 h-5 text-slate-500 group-hover:text-white transition-colors transform group-hover:translate-x-1 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            </div>

            <!-- Botón INSTAGRAM -->
            <div class="link-wrapper fade-in-up delay-400">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" 
                   class="link-card hover-instagram group relative flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 backdrop-blur-md border border-slate-700/50">
                    <div class="card-content flex items-center gap-4 z-10 w-full justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-[#E1306C]/10 flex items-center justify-center group-hover:bg-[#E1306C]/20 transition-colors">
                                <!-- Instagram SVG -->
                                <svg class="w-5 h-5 text-[#E1306C]" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
                                </svg>
                            </div>
                            <span class="font-semibold text-slate-100 tracking-wide text-lg">Instagram</span>
                        </div>
                        <svg class="w-5 h-5 text-slate-500 group-hover:text-white transition-colors transform group-hover:translate-x-1 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            </div>

            <!-- Botón WHATSAPP -->
            <div class="link-wrapper fade-in-up delay-500">
                <a href="https://whatsapp.com/channel/tu-enlace" target="_blank" rel="noopener noreferrer" 
                   class="link-card hover-whatsapp group relative flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 backdrop-blur-md border border-slate-700/50">
                    <div class="card-content flex items-center gap-4 z-10 w-full justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-[#25D366]/10 flex items-center justify-center group-hover:bg-[#25D366]/20 transition-colors">
                                <!-- WhatsApp SVG -->
                                <svg class="w-5 h-5 text-[#25D366]" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                                </svg>
                            </div>
                            <span class="font-semibold text-slate-100 tracking-wide text-lg">Canal de WhatsApp</span>
                        </div>
                        <svg class="w-5 h-5 text-slate-500 group-hover:text-white transition-colors transform group-hover:translate-x-1 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            </div>
            
        </div>
    </main>

</body>
</html>
